name: Update Team DSA Leaderboard

on:
  schedule:
    # Runs twice every hour offset from :00 (at minute :07 and :52 -> 45 min apart)
    - cron: '7,52 * * * *'
    # 9:00 PM IST (15:30 UTC) - Reminder trigger
    - cron: '30 15 * * *'
    # 1:55 AM IST (20:25 UTC) - End-of-cycle snapshot
    - cron: '25 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tracker Script & Email Reminder
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python track_team.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md daily_history.csv
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-update leaderboard & daily history [skip ci]"
            git pull --rebase origin main
            git push
          fi
