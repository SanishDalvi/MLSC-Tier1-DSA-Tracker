name: Update Team DSA Leaderboard

on:
  schedule:
    # 1. Runs at minute 0 and 45 of every hour
    - cron: '0,45 * * * *'
    # 2. Reminder at 9:00 PM IST (15:30 UTC)
    - cron: '30 15 * * *'
    # 3. Final Day Snapshot at 1:55 AM IST (20:25 UTC), right before the 2 AM rollover
    - cron: '25 20 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tracker Script & Email Reminder
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python track_team.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "Auto-update leaderboard & daily history [skip ci]" && git push)
